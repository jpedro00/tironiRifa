name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PostgreSQL REAL. A suíte de isolamento precisa de RLS de verdade: com
# mock, o teste provaria apenas que o mock funciona.
jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Bootstrap: cria o banco de teste e os dois papéis restritos.
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_NAME: campaigns_test
      APP_DB_PASSWORD: app_ci_password
      WORKER_DB_PASSWORD: worker_ci_password

      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/campaigns_test

      # As três conexões usadas pelos testes. A de aplicação é o papel
      # restrito: é isso que faz a verificação de RLS valer.
      TEST_MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/campaigns_test
      TEST_APP_DATABASE_URL: postgres://app_user:app_ci_password@localhost:5432/campaigns_test
      TEST_WORKER_DATABASE_URL: postgres://app_worker:worker_ci_password@localhost:5432/campaigns_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar pacotes compartilhados
        # api, worker e frontends importam os tipos de @campaigns/shared e
        # @campaigns/db; sem build, o typecheck não encontra as declarações.
        run: |
          npm run build -w @campaigns/shared
          npm run build -w @campaigns/db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Bootstrap do banco (papéis restritos)
        run: npm run db:bootstrap

      - name: Migrations em banco vazio
        run: npm run db:migrate

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Rede de segurança: se o banco não estiver configurado, a suíte PULA os
      # testes de RLS em vez de falhar — e um CI verde sem eles seria uma
      # falsa aprovação. Este passo falha se algum teste foi pulado.
      - name: Garantir que nenhum teste de banco foi pulado
        run: |
          npx vitest run --reporter=json --outputFile=.vitest-report.json
          node -e "
            const report = require('./.vitest-report.json');
            const skipped = report.numPendingTests ?? 0;
            if (skipped > 0) {
              console.error('FALHA: ' + skipped + ' teste(s) pulado(s). Os testes de banco precisam rodar no CI.');
              process.exit(1);
            }
            console.log('Nenhum teste pulado. Total: ' + report.numTotalTests);
          "
